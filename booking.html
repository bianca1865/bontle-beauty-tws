<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Your Appointment | Bontle Beauty Lounge</title>

    <link rel="stylesheet" href="bontle.css">
</head>

<body>

    <div class="booking-page">

        <a href="contact.html" class="back-button">
            ← Back
        </a>

        <div class="booking-container">

            <h1>Book Your Appointment</h1>

            <p>
                Fill in the details below to book your slot with us.
            </p>

            <div class="contact-form">

                <form>

                    <div class="form-row">

                        <div class="form-group">
                            <label for="name">Full Name</label>

                            <input
                                type="text"
                                class="form-control"
                                id="name"
                                placeholder="Enter your name"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="phone">Phone Number</label>

                            <input
                                type="tel"
                                class="form-control"
                                id="phone"
                                placeholder="Enter your number"
                                required>
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="email">Email</label>

                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                placeholder="Enter your email"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="service">Service</label>

                            <select
                                class="form-control"
                                id="service"
                                required>

                                <option value="">
                                    Select a service
                                </option>

                                <option>Classic Hair</option>
                                <option>Nails</option>
                                <option>Facials</option>

                            </select>
                        </div>

                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="date">Date</label>

                            <input
                                type="date"
                                class="form-control"
                                id="date"
                                required>
                        </div>

                        <div class="form-group">
                            <label for="time">Hour</label>

                            <input
                                type="time"
                                class="form-control"
                                id="time"
                                required>
                        </div>

                    </div>


                    <div class="form-group">

                        <label for="message">Message</label>

                        <textarea
                            class="form-control"
                            id="message"
                            rows="4"
                            placeholder="Write your message..."></textarea>

                    </div>


                    <button
                        type="submit"
                        class="btn-book">

                        Book Your Slot

                    </button>

                </form>

            </div>

        </div>

    </div>

</body>
</html>
